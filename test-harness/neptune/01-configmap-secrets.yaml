---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neptune-config
  namespace: neptune
data:
  # Database configuration for Neptune metadata
  POSTGRES_USER: "neptune"
  POSTGRES_DB: "neptune"
  POSTGRES_PORT: "5432"
  
  # Redis configuration for caching
  REDIS_PORT: "6379"
  
  # Neptune Server configuration
  NEPTUNE_HOST: "0.0.0.0"
  NEPTUNE_PORT: "5000"
  
  # MinIO configuration for file storage
  MINIO_ROOT_USER: "neptune"
  MINIO_CONSOLE_PORT: "9001"
  MINIO_API_PORT: "9000"
  AWS_REGION: "us-east-1"
  
  # Neptune specific settings
  NEPTUNE_BACKEND_STORAGE_PATH: "/neptune-storage"
  NEPTUNE_ARTIFACTS_BUCKET: "neptune-artifacts"
---
apiVersion: v1
kind: Secret
metadata:
  name: neptune-secrets
  namespace: neptune
type: Opaque
data:
  # These are base64 encoded values - replace with your actual encoded secrets
  # echo -n "your_password" | base64
  POSTGRES_PASSWORD: bmVwdHVuZV9wYXNzd29yZA==  # neptune_password
  REDIS_PASSWORD: bmVwdHVuZV9yZWRpcw==  # neptune_redis
  MINIO_ROOT_PASSWORD: bmVwdHVuZTEyMw==  # neptune123
  AWS_ACCESS_KEY_ID: bmVwdHVuZQ==  # neptune
  AWS_SECRET_ACCESS_KEY: bmVwdHVuZTEyMw==  # neptune123
  NEPTUNE_API_TOKEN: ""  # Add your Neptune API token here (base64 encoded)
