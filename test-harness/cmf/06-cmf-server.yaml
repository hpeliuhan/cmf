---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cmf-server-pvc
  namespace: cmf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmf-server
  namespace: cmf
  labels:
    app: cmf-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cmf-server
  template:
    metadata:
      labels:
        app: cmf-server
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: cmf-server
        image: server:latest
        ports:
        - containerPort: 8000
        env:
        - name: MYIP
          valueFrom:
            configMapKeyRef:
              name: cmf-config
              key: MYIP
        - name: HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: cmf-config
              key: HOSTNAME
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: cmf-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cmf-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: cmf-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: cmf-config
              key: POSTGRES_DB
        volumeMounts:
        - name: cmf-server-data
          mountPath: /cmf-server/data
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: cmf-server-data
        persistentVolumeClaim:
          claimName: cmf-server-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cmf-server
  namespace: cmf
spec:
  selector:
    app: cmf-server
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
