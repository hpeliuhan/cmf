---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aim-config
  namespace: aim
data:
  # AIM Server configuration
  AIM_REPO_PATH: "/aim-repo"
  AIM_HOST: "0.0.0.0"
  AIM_PORT: "43800"
  AIM_WEB_PORT: "43801"
  
  # Optional PostgreSQL for metadata (AIM can work with file-based storage)
  POSTGRES_USER: "aim"
  POSTGRES_DB: "aim"
  POSTGRES_PORT: "5432"
  
  # MinIO configuration for artifacts storage
  MINIO_ROOT_USER: "aim"
  MINIO_CONSOLE_PORT: "9001"
  MINIO_API_PORT: "9000"
  AWS_REGION: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: aim-secrets
  namespace: aim
type: Opaque
data:
  # These are base64 encoded values - replace with your actual encoded secrets
  # echo -n "your_password" | base64
  POSTGRES_PASSWORD: YWltX3Bhc3N3b3Jk  # aim_password
  MINIO_ROOT_PASSWORD: YWltMTIz  # aim123
  AWS_ACCESS_KEY_ID: YWlt  # aim
  AWS_SECRET_ACCESS_KEY: YWltMTIz  # aim123
