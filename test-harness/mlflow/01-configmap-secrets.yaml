---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-config
  namespace: mlflow
data:
  # Database configuration
  POSTGRES_USER: "mlflow_user"
  POSTGRES_DB: "mlflow"
  POSTGRES_PORT: "5432"
  
  # MinIO configuration
  MINIO_ROOT_USER: "minio"
  MINIO_CONSOLE_PORT: "9001"
  MINIO_API_PORT: "9000"
  AWS_DEFAULT_REGION: "us-east-1"
  
  # MLflow configuration
  MLFLOW_BACKEND_STORE_URI: "postgresql://mlflow_user:mlflow_password@postgres:5432/mlflow"
  MLFLOW_DEFAULT_ARTIFACT_ROOT: "s3://mlflow-artifacts/"
  MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
  MLFLOW_PORT: "5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secrets
  namespace: mlflow
type: Opaque
data:
  # These are base64 encoded values - replace with your actual encoded secrets
  # echo -n "your_password" | base64
  POSTGRES_PASSWORD: bWxmbG93X3Bhc3N3b3Jk  # mlflow_password
  MINIO_ROOT_PASSWORD: bWluaW8xMjM=  # minio123
  AWS_ACCESS_KEY_ID: bWluaW8=  # minio
  AWS_SECRET_ACCESS_KEY: bWluaW8xMjM=  # minio123
