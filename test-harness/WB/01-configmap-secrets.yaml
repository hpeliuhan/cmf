---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wandb-config
  namespace: wandb
data:
  # Database configuration
  POSTGRES_USER: "wandb"
  POSTGRES_DB: "wandb"
  POSTGRES_PORT: "5432"
  
  # Redis configuration
  REDIS_PORT: "6379"
  
  # W&B Server configuration
  WANDB_HOST: "0.0.0.0"
  WANDB_PORT: "8080"
  BUCKET: "wandb"
  AWS_REGION: "us-east-1"
  
  # MinIO configuration for file storage
  MINIO_ROOT_USER: "wandb"
  MINIO_CONSOLE_PORT: "9001"
  MINIO_API_PORT: "9000"
---
apiVersion: v1
kind: Secret
metadata:
  name: wandb-secrets
  namespace: wandb
type: Opaque
data:
  # These are base64 encoded values - replace with your actual encoded secrets
  # echo -n "your_password" | base64
  POSTGRES_PASSWORD: d2FuZGJfcGFzc3dvcmQ=  # wandb_password
  REDIS_PASSWORD: cmVkaXNfcGFzc3dvcmQ=  # redis_password
  MINIO_ROOT_PASSWORD: d2FuZGIxMjM=  # wandb123
  AWS_ACCESS_KEY_ID: d2FuZGI=  # wandb
  AWS_SECRET_ACCESS_KEY: d2FuZGIxMjM=  # wandb123
  WANDB_LICENSE: ""  # Add your W&B license key here (base64 encoded)
